<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brightloop Subscriptions</title>
<style>:root{--b:#4f46e5;--bg:#f6f7fb}body{font:14px system-ui;margin:0;background:var(--bg)}header{background:var(--b);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center}
header a{color:#fff;cursor:pointer;opacity:.85}header a:hover{opacity:1}main{padding:20px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi b{display:block;font-size:24px;color:var(--b)}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}input,select{padding:7px;margin:3px;border:1px solid #ccc;border-radius:6px}
button{background:var(--b);color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;margin:2px}.err{color:#c00}.tag{padding:2px 8px;border-radius:99px;background:#e0e7ff}</style></head><body>
<header><b>Brightloop</b><span id="nav"></span><span style="flex:1"></span><span id="who"></span></header><main id="m"></main>
<script>
const $=s=>document.querySelector(s);let me=null;
const api=async(u,m='GET',b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const tbl=(rows,acts)=>rows.length?`<table><tr>${Object.keys(rows[0]).map(k=>`<th>${k}</th>`).join('')}${acts?'<th></th>':''}</tr>${rows.map(r=>`<tr>${Object.values(r).map(v=>`<td>${v??''}</td>`).join('')}${acts?`<td>${acts(r)}</td>`:''}</tr>`).join('')}</table>`:'<i>No records</i>';
function auth(msg=''){document.getElementById('nav').innerHTML='';$('#who').innerHTML='';$('#m').innerHTML=`<div class=card style="max-width:380px;margin:40px auto"><h3>Sign in / Sign up</h3><div class=err>${msg}</div>
<input id=n placeholder="Name"><br><input id=e placeholder="Email"><br><input id=p type=password placeholder="Password (>8, Aa, special)"><br>
<button onclick="login()">Login</button><button onclick="signup()">Sign up</button><button onclick="forgot()">Forgot password</button></div>`;
 if(location.hash.startsWith('#reset=')){$('#m').innerHTML+=`<div class=card style="max-width:380px;margin:auto"><h3>Reset password</h3><input id=np type=password placeholder="New password"><button onclick="doReset()">Reset</button></div>`}}
const val=i=>document.getElementById(i).value;
async function login(){try{me=await api('login','POST',{email:val('e'),password:val('p')});boot()}catch(x){auth(x.message)}}
async function signup(){try{await api('signup','POST',{name:val('n'),email:val('e'),password:val('p')});auth('Account created. Please login.')}catch(x){auth(x.message)}}
async function forgot(){await api('forgot','POST',{email:val('e')});auth('If the email exists, a reset link has been sent.')}
async function doReset(){try{await api('reset','POST',{token:location.hash.slice(7),password:val('np')});location.hash='';auth('Password updated.')}catch(x){auth(x.message)}}
const staff=()=>me.role!='customer', admin=()=>me.role=='admin';
function boot(){$('#who').innerHTML=`${me.role} <a onclick="api('logout','POST').then(()=>auth())">logout</a>`;
 const tabs=staff()?['dashboard','subscriptions','invoices','payments']:['subscriptions','invoices'];if(admin())tabs.push('catalogue','discounts','staff');
 $('#nav').innerHTML=tabs.map(t=>`<a onclick="go('${t}')">${t}</a>`).join('');go(tabs[0])}
async function go(t){const v=await views[t]();$('#m').innerHTML=v}
const views={
 async dashboard(){const d=await api('dashboard');return`<div class=kpis>${[['Active subscriptions',d.active_subscriptions],['MRR',d.mrr.toFixed(2)],['Revenue collected',d.revenue_collected],['Outstanding',d.outstanding],['Overdue invoices',d.overdue_count]].map(([a,b])=>`<div class="card kpi"><b>${b}</b>${a}</div>`).join('')}</div><div class=card><h3>Invoices by status</h3>${tbl(d.invoices_by_status)}</div><div class=card><button onclick="api('billing/run','POST',{}).then(r=>alert(r.created+' invoices created'))">Run billing now</button></div>`},
 async subscriptions(){const s=await api('subscriptions');return`<div class=card><h3>Subscriptions</h3>${staff()?`<input id=sc placeholder="customer id"><input id=sp placeholder="plan id"><input id=spr placeholder="product id"><input id=sq placeholder="qty" value=1><button onclick="newSub()">Create</button>`:''}${tbl(s,r=>staff()?['quote','confirm','activate','pause','renew','close'].map(a=>`<button onclick="api('subscriptions/${r.id}/${a}','POST').then(()=>go('subscriptions')).catch(e=>alert(e.message))">${a}</button>`).join(''):'')}</div>`},
 async invoices(){const s=await api('invoices');return`<div class=card><h3>Invoices <small>(filter: <a href="#" onclick="filt(event,'overdue')">overdue</a> <a href="#" onclick="filt(event,'paid')">paid</a> <a href="#" onclick="filt(event,'')">all</a>)</small></h3><div id=il>${tbl(s,invAct)}</div></div>`},
 async payments(){return`<div class=card><h3>Record payment</h3><input id=pi placeholder="invoice id"><input id=pa placeholder="amount"><select id=pm><option>bank</option><option>upi</option><option>card</option><option>cash</option></select><input id=pn placeholder="note"><button onclick="pay()">Save</button></div>`},
 async catalogue(){const[p,pl,t]=await Promise.all([api('products'),api('plans'),api('taxes')]);return`<div class=card><h3>New product</h3><input id=pn1 placeholder=name><input id=pt placeholder=type><input id=ps placeholder="sales price"><input id=pc placeholder="cost price"><button onclick="mk('products',{name:val('pn1'),type:val('pt'),sales_price:+val('ps'),cost_price:+val('pc')})">Add</button><br>Variant: <input id=vp placeholder="product id"><input id=va placeholder="attribute (brand)"><input id=vv placeholder="value (Odoo)"><input id=ve placeholder="extra price"><button onclick="mk('variants',{product_id:+val('vp'),attribute:val('va'),value:val('vv'),extra_price:+val('ve')})">Add</button>${tbl(p)}</div><div class=card><h3>New plan</h3><input id=lp placeholder=name><input id=lpr placeholder=price><select id=lpe><option>daily<option>weekly<option selected>monthly<option>yearly</select><input id=lm placeholder="min qty" value=1><input id=ls type=date><input id=le type=date><label><input type=checkbox id=l1>auto close</label><label><input type=checkbox id=l2>pause</label><label><input type=checkbox id=l3>early close</label><label><input type=checkbox id=l4 checked>renew</label><button onclick="mk('plans',{name:val('lp'),price:+val('lpr'),period:val('lpe'),min_qty:+val('lm'),start_date:val('ls'),end_date:val('le'),auto_close:+$('#l1').checked,allow_pause:+$('#l2').checked,allow_early_close:+$('#l3').checked,allow_renew:+$('#l4').checked})">Add</button>${tbl(pl)}</div><div class=card><h3>Taxes</h3><input id=tn placeholder=name><input id=tr placeholder="rate %"><button onclick="mk('taxes',{name:val('tn'),rate:+val('tr')})">Add</button>${tbl(t)}</div>`},
 async discounts(){const d=await api('discounts');return`<div class=card><h3>New discount</h3><input id=dn placeholder=name><select id=dk><option>percent<option>fixed</select><input id=dv placeholder=value><input id=dm placeholder="min amount"><input id=dq placeholder="min qty"><input id=ds type=date><input id=de type=date><input id=dl placeholder="usage limit"><button onclick="mk('discounts',{name:val('dn'),kind:val('dk'),value:+val('dv'),min_amount:+val('dm')||0,min_qty:+val('dq')||0,start_date:val('ds')||null,end_date:val('de')||null,usage_limit:+val('dl')||null})">Add</button>${tbl(d)}</div>`},
 async staff(){return`<div class=card><h3>Add staff</h3><input id=fn placeholder=name><input id=fe placeholder=email><input id=fp type=password placeholder=password><button onclick="mk('staff',{name:val('fn'),email:val('fe'),password:val('fp')})">Add</button></div>`}};
const invAct=r=>staff()?['confirm','send','cancel'].map(a=>`<button onclick="api('invoices/${r.id}/${a}','POST').then(()=>go('invoices')).catch(e=>alert(e.message))">${a}</button>`).join('')+`<button onclick="print()">print</button>`:'';
async function filt(e,s){e.preventDefault();$('#il').innerHTML=tbl(await api('invoices'+(s?'?status='+s:'')),invAct)}
async function mk(t,b){try{await api(t,'POST',b);alert('Saved');go(t=='staff'?'staff':t=='variants'||t=='products'||t=='plans'||t=='taxes'?'catalogue':t)}catch(x){alert(x.message)}}
async function newSub(){try{await api('subscriptions','POST',{customer_id:+val('sc'),plan_id:+val('sp'),lines:[{product_id:+val('spr'),qty:+val('sq')}]});go('subscriptions')}catch(x){alert(x.message)}}
async function pay(){try{await api('payments','POST',{invoice_id:+val('pi'),amount:+val('pa'),method:val('pm'),note:val('pn')});alert('Recorded')}catch(x){alert(x.message)}}
auth();
</script></body></html>
